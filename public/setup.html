<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sikineo — neo本体の配置</title>
  <link rel="stylesheet" href="/drawing.css">
</head>
<body>
  <main>
    <h1>neo本体を配置してください</h1>
    <p>指定配布元のPaintBBS NEOのJavaScriptまたはCSSが見つかりません。neo本体はプラグインに同梱していません。</p>
    <ol>
      <li>以下の上流ファイルを取得します。
        <ul>
          <li><a href="https://oekakibbs.moe/apps/neo/neo.js" target="_blank" rel="noopener noreferrer">neo.js</a></li>
          <li><a href="https://oekakibbs.moe/apps/neo/neo.css" target="_blank" rel="noopener noreferrer">neo.css</a></li>
        </ul>
      </li>
      <li>プラグインの<samp>sikineo/</samp>フォルダ内に<samp>neo/</samp>を作り、次のパスへ配置します。
        <ul>
          <li><samp>neo/neo.js</samp></li>
          <li><samp>neo/neo.css</samp></li>
        </ul>
      </li>
      <li>このページを再読み込みします。Sikiの再起動は不要です。</li>
    </ol>
    <p class="note">取得後の描画には外部ネットワーク接続は不要です。neo本体の著作権表示は削除しないでください。</p>
  </main>
</body>
</html>
